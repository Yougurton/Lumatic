<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="dark" />
    <title>ChroEditor</title>
    <link rel="icon" href="data:," />
    <style>
      :root {
        --bg: #101114;
        --panel: #16171c;
        --panel2: #1c1e25;
        --line: #2a2c34;
        --text: #d9dce4;
        --dim: #8a90a0;
        --accent: #6aa6ff;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font: 13px system-ui, 'Segoe UI', sans-serif;
        overflow: clip;
        user-select: none;
      }
      #app {
        display: grid;
        grid-template-rows: auto minmax(160px, 44%) 6px 1fr;
        height: 100%;
      }
      #toolbar {
        display: flex;
        align-items: center;
        gap: 6px;
        background: var(--panel);
        border-bottom: 1px solid var(--line);
        white-space: nowrap;
        overflow: hidden;
        /* (a narrow window: the toolbar goes on into a second line rather than out of sight) */
        flex-wrap: wrap;
        row-gap: 4px;
        padding: 4px 8px;
        min-height: 40px;
      }
      #toolbar #recent {
        max-width: 140px;
      }
      #toolbar #difficulty {
        max-width: 200px;
      }
      #toolbar label {
        display: flex;
        align-items: center;
        gap: 4px;
      }
      #toolbar .sep {
        width: 1px;
        height: 22px;
        background: var(--line);
        margin: 0 4px;
      }
      #toolbar .grow {
        flex: 1;
      }
      button,
      select,
      input[type='number'] {
        background: var(--panel2);
        color: var(--text);
        border: 1px solid var(--line);
        border-radius: 5px;
        padding: 4px 9px;
        font: inherit;
        cursor: pointer;
      }
      button:hover {
        border-color: #3d4150;
      }
      button:disabled {
        opacity: 0.4;
        cursor: default;
      }
      button.active {
        background: #263a5c;
        border-color: var(--accent);
      }
      #status {
        color: var(--dim);
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 38vw;
        min-width: 0;
      }
      #time {
        font-variant-numeric: tabular-nums;
        min-width: 150px;
        color: #fff;
      }
      #main {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 300px;
        min-height: 0;
        min-width: 0;
      }
      #preview-wrap {
        position: relative;
        min-height: 0;
        background: #000;
      }
      #preview-wrap canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      #side {
        min-width: 0;
        overflow: hidden;
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        grid-template-rows: minmax(0, 1fr);
        border-left: 1px solid var(--line);
        background: var(--panel);
        min-height: 0;
      }
      #library {
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
      .lib-tabs {
        display: flex;
        gap: 2px;
        padding: 4px 6px 0;
        border-bottom: 1px solid var(--line);
        flex-shrink: 0;
      }
      .lib-tabs button {
        border-radius: 5px 5px 0 0;
        border-bottom: 0;
        padding: 4px 10px;
        background: none;
        color: var(--dim);
      }
      .lib-tabs button.active {
        background: var(--panel2);
        color: #fff;
        border-color: var(--line);
      }
      .lib-body {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
      }
      .lib-presets {
        display: flex;
        flex-direction: column;
        min-height: 0;
        flex: 1;
      }
      .lib-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 6px;
        padding: 6px 8px 2px;
      }
      .lib-head button {
        padding: 2px 8px;
        font-size: 12px;
      }
      .lib-select {
        padding: 2px 4px;
        font-size: 12px;
        max-width: 140px;
      }
      .lib-target {
        color: var(--dim);
        font-size: 11px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .lib-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px;
        padding: 6px 8px;
      }
      .lib-card {
        position: relative;
        background: #16171d;
        border: 1px solid #2a2c35;
        border-radius: 6px;
        padding: 4px;
        cursor: pointer;
        min-width: 0;
      }
      .lib-card:hover {
        border-color: #4a5068;
      }
      .lib-card.armed {
        border-color: var(--accent);
        box-shadow: 0 0 0 1px var(--accent) inset;
      }
      .lib-card canvas {
        width: 100%;
        height: auto;
        aspect-ratio: 200 / 64;
        display: block;
        border-radius: 3px;
      }
      .lib-name {
        font-size: 11px;
        margin-top: 3px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        padding-right: 18px;
      }
      .lib-try {
        position: absolute;
        right: 3px;
        bottom: 2px;
        padding: 0 4px;
        font-size: 10px;
        line-height: 15px;
        opacity: 0;
      }
      .lib-card:hover .lib-try {
        opacity: 1;
      }
      .lib-tip {
        color: var(--dim);
        font-size: 11px;
        padding: 4px 10px 10px;
        line-height: 1.4;
      }
      .pr-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 6px 10px;
        color: #fff;
        font-weight: 600;
        border-bottom: 1px solid var(--line);
      }
      .pr-head button {
        padding: 2px 8px;
        font-weight: 400;
      }
      .pr-list {
        overflow-y: auto;
        flex: 1;
        min-height: 0;
      }
      .pr-empty {
        color: var(--dim);
        font-size: 12px;
        padding: 10px;
        line-height: 1.45;
      }
      .pr-item {
        min-width: 0;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 5px 10px;
        border-bottom: 1px solid #22242b;
      }
      .pr-item:hover {
        background: #1d1f27;
      }
      .pr-sketch {
        width: 96px;
        height: 30px;
        border-radius: 3px;
        flex-shrink: 0;
      }
      .pr-text {
        flex: 1;
        min-width: 0;
      }
      .pr-name {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .pr-info {
        color: var(--dim);
        font-size: 11px;
      }
      .pr-item button {
        padding: 2px 7px;
      }
      #inspector {
        overflow-y: auto;
        padding: 8px 12px 16px;
        width: 290px;
        flex-shrink: 0;
        border-left: 1px solid var(--line);
        background: var(--panel);
      }
      #inspector h3 {
        margin: 2px 0 10px;
        font-size: 13px;
        color: #fff;
      }
      .ins-section {
        margin-bottom: 10px;
      }
      .ins-label {
        color: var(--dim);
        font-size: 11px;
        margin-bottom: 4px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .ins-buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
      }
      .ins-buttons button {
        padding: 3px 7px;
      }
      .ins-color {
        display: flex;
        gap: 6px;
        align-items: center;
      }
      .ins-swatch {
        width: 26px;
        height: 22px;
        padding: 0;
        border-radius: 4px;
      }
      .ins-swatch.active,
      .ins-color input.active {
        outline: 2px solid #fff;
        outline-offset: 1px;
      }
      .ins-color input[type='color'] {
        width: 34px;
        height: 24px;
        padding: 0;
        border: 1px solid var(--line);
        background: none;
      }
      .ins-bright {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-top: 6px;
      }
      .ins-bright input {
        flex: 1;
      }
      .ins-value {
        width: 34px;
        color: var(--dim);
      }
      .ins-number {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        margin: 6px 0;
        color: var(--dim);
      }
      .ins-number input {
        width: 92px;
      }
      .ins-check {
        display: block;
        margin: 6px 0 10px;
        color: var(--text);
      }
      .ins-inside {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        background: #2a2140;
        border: 1px solid #5b4a8a;
        border-radius: 6px;
        padding: 5px 8px;
        margin-bottom: 10px;
        color: #e4dcff;
      }
      .ins-inside button {
        padding: 2px 8px;
      }
      .ins-warn {
        background: #3a2e14;
        border: 1px solid #6b5521;
        color: #ffe2a3;
        border-radius: 6px;
        padding: 6px 8px;
        margin-bottom: 10px;
        font-size: 12px;
        line-height: 1.4;
      }
      .ins-warn button {
        display: block;
        margin-top: 6px;
      }
      .ins-actions {
        margin-bottom: 10px;
      }
      .ins-text {
        width: 100%;
        background: #121318;
        color: var(--text);
        border: 1px solid var(--line);
        border-radius: 5px;
        padding: 5px 8px;
        font: inherit;
        margin-bottom: 10px;
      }
      .ins-note {
        overflow-wrap: anywhere;
        color: var(--dim);
        font-size: 12px;
        line-height: 1.45;
        margin-top: 10px;
      }
      #splitter {
        background: var(--line);
        cursor: ns-resize;
      }
      #timeline {
        display: flex;
        min-height: 0;
        position: relative;
        background: var(--panel);
      }
      #track-headers {
        width: 230px;
        flex-shrink: 0;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        border-right: 1px solid var(--line);
        background: var(--panel);
      }
      .th-ruler {
        border-bottom: 1px solid var(--line);
        color: var(--dim);
        padding: 0 6px;
        font-size: 11px;
        background: #101115;
        display: flex;
        align-items: center;
        gap: 4px;
        flex-shrink: 0;
        overflow: hidden;
        white-space: nowrap;
      }
      .th-tool,
      .th-crumb {
        padding: 2px 7px;
        font-size: 12px;
      }
      .th-crumb {
        background: none;
        border-color: transparent;
        max-width: 120px;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .th-crumb.current {
        color: #fff;
        font-weight: 600;
      }
      .th-crumb-sep {
        color: var(--dim);
      }
      .th-rows {
        overflow: hidden;
        position: relative;
        flex-shrink: 0;
      }
      .th-drop {
        position: absolute;
        left: 0;
        right: 0;
        height: 2px;
        background: var(--accent);
        pointer-events: none;
      }
      .th-spectro {
        border-top: 1px solid var(--line);
        color: var(--dim);
        font-size: 11px;
        padding: 0 6px 0 10px;
        background: #0b0b10;
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 6px;
        overflow: hidden;
        flex-shrink: 0;
        box-sizing: border-box;
      }
      .th-spectro span {
        padding-top: 7px;
      }
      .th-spectro button {
        margin-top: 4px;
        padding: 1px 6px;
        font-size: 11px;
      }
      .ce-menu.ce-panel {
        padding: 10px 14px 12px;
        min-width: 320px;
      }
      .ce-panel-body {
        display: grid;
        gap: 8px;
      }
      .ce-panel .ce-panel-row {
        display: grid;
        grid-template-columns: 92px 1fr 64px;
        align-items: center;
        gap: 8px;
        font-size: 12px;
      }
      .ce-panel .ce-panel-value {
        color: var(--dim);
        font-size: 11px;
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      .ce-panel .ce-panel-buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
      }
      .ce-panel .ce-panel-buttons button {
        padding: 2px 8px;
        font-size: 12px;
      }
      .th-nav {
        border-top: 1px solid var(--line);
        color: var(--dim);
        font-size: 11px;
        padding: 6px 10px;
        background: #0d0e12;
        flex-shrink: 0;
      }
      .th-row.compact {
        font-size: 11px;
      }
      .th-row.compact .th-toggle {
        height: 15px;
        width: 16px;
        font-size: 10px;
      }
      .th-row {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 0 8px;
        border-bottom: 1px solid #25272f;
        overflow: hidden;
        white-space: nowrap;
      }
      .th-group {
        background: #1b1d24;
        font-weight: 600;
      }
      .th-light {
        color: var(--dim);
        font-size: 12px;
        cursor: pointer;
      }
      .th-light.selected {
        background: #1d2a40;
        color: #cfe2ff;
      }
      .th-light:hover,
      .th-light.picked {
        color: #3dff7a;
      }
      .th-custom {
        background: #1c1e29;
        font-weight: 600;
        cursor: pointer;
      }
      .th-enter {
        padding: 0 5px;
        font-size: 12px;
        line-height: 18px;
      }
      .th-raw {
        color: #b9bfcc;
        font-size: 12px;
        background: #191a1f;
      }
      .th-toggle {
        width: 20px;
        height: 20px;
        padding: 0;
        line-height: 1;
      }
      .th-swatch {
        width: 8px;
        height: 14px;
        border-radius: 2px;
        flex-shrink: 0;
      }
      .th-name {
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .th-count {
        color: var(--dim);
        font-weight: 400;
        font-size: 11px;
      }
      #tracks-wrap {
        flex: 1;
        position: relative;
        min-width: 0;
      }
      #tracks {
        display: block;
      }
      .ce-menu {
        position: fixed;
        z-index: 50;
        background: #1f2129;
        border: 1px solid #383b47;
        border-radius: 6px;
        padding: 4px 0;
        min-width: 210px;
        box-shadow: 0 8px 28px rgba(0, 0, 0, 0.5);
      }
      .ce-menu-item {
        display: flex;
        justify-content: space-between;
        gap: 18px;
        width: 100%;
        background: none;
        border: 0;
        border-radius: 0;
        text-align: left;
        padding: 5px 14px;
        white-space: pre;
      }
      .ce-menu-item:hover:not(:disabled) {
        background: #2b3a57;
      }
      .ce-menu-hint {
        color: var(--dim);
        font-size: 11px;
      }
      .ce-menu-heading {
        color: var(--dim);
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        padding: 6px 14px 3px;
      }
      .ce-menu-sep {
        height: 1px;
        background: #33363f;
        margin: 4px 0;
      }
      .ce-shade {
        position: fixed;
        inset: 0;
        z-index: 60;
        background: rgba(0, 0, 0, 0.45);
        display: grid;
        place-items: center;
      }
      .ce-dialog {
        background: #1c1e25;
        border: 1px solid #383b47;
        border-radius: 8px;
        padding: 16px 18px;
        min-width: 340px;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
        user-select: text;
      }
      .ce-dialog-title {
        color: #fff;
        font-weight: 600;
        margin-bottom: 10px;
      }
      .ce-dialog input[type='text'],
      .ce-dialog input[type='number'],
      .ce-dialog select {
        width: 100%;
        background: #121318;
        color: var(--text);
        border: 1px solid var(--line);
        border-radius: 5px;
        padding: 6px 8px;
        font: inherit;
      }
      .ce-dialog-buttons {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-top: 14px;
      }
      .env-dialog {
        width: min(900px, 96vw);
        max-height: 92vh;
        display: flex;
        flex-direction: column;
      }
      .env-tabs {
        display: flex;
        gap: 6px;
        margin-bottom: 10px;
      }
      .env-tabs button.active {
        border-color: var(--accent, #6c8cff);
        color: #fff;
      }
      .env-page {
        overflow: auto;
        min-height: 0;
      }
      .env-note {
        margin-bottom: 10px;
      }
      .env-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 10px;
      }
      .env-card {
        display: flex;
        flex-direction: column;
        gap: 5px;
        padding: 8px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #15161c;
      }
      .env-card.active {
        border-color: #6c8cff;
        box-shadow: 0 0 0 1px #6c8cff inset;
      }
      .env-card img {
        width: 100%;
        aspect-ratio: 16 / 9;
        object-fit: cover;
        border-radius: 4px;
        background: #000;
      }
      .env-card-name {
        color: #fff;
        font-weight: 600;
        font-size: 13px;
      }
      .env-card-text {
        flex: 1;
      }
      .env-card-lights {
        font-size: 12px;
        color: var(--dim);
      }
      .env-card-lights summary {
        cursor: pointer;
      }
      .env-filter {
        display: flex;
        gap: 8px;
        margin-bottom: 10px;
      }
      .env-filter select {
        width: auto !important;
      }
      .env-filter input {
        flex: 1;
        min-width: 0;
        background: #121318;
        color: var(--text);
        border: 1px solid var(--line);
        border-radius: 5px;
        padding: 6px 8px;
        font: inherit;
      }
      .env-gallery {
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
      .env-dialog .env-gallery .env-grid {
        overflow: auto;
        max-height: 62vh;
        padding-right: 4px;
      }
      .env-card img.missing,
      .env-plate img.missing {
        visibility: hidden;
      }
      .env-credits {
        margin-top: 10px;
      }
      .env-credits details {
        display: inline;
      }
      .env-plate-wrap {
        display: flex;
        flex-direction: column;
        gap: 4px;
        font-size: 12px;
      }
      .env-plate {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 6px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #15161c;
        font-size: 13px;
      }
      .env-plate img {
        width: 128px;
        aspect-ratio: 16 / 9;
        object-fit: cover;
        border-radius: 4px;
        background: #000;
      }
      .env-plate > div {
        flex: 1;
        min-width: 0;
      }
      .env-license {
        white-space: pre-wrap;
        font-size: 11px;
        max-height: 160px;
        overflow: auto;
      }
      .env-parts {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 4px 12px;
        font-size: 13px;
      }
      .env-subtitle {
        color: #fff;
        font-weight: 600;
        margin: 14px 0 6px;
      }
      .env-ring {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px;
        margin-bottom: 6px;
        font-size: 13px;
      }
      .env-ring-name {
        min-width: 200px;
      }
      .env-ring label {
        display: flex;
        align-items: center;
        gap: 6px;
        color: var(--dim);
        font-size: 12px;
      }
      .env-ring input[type='number'] {
        width: 70px !important;
      }
      .nm-dialog {
        width: min(640px, 94vw);
      }
      .nm-cover {
        width: 30px;
        height: 30px;
        object-fit: cover;
        border-radius: 4px;
        flex: none;
      }
      .nm-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px 14px;
      }
      .nm-grid label {
        display: flex;
        flex-direction: column;
        gap: 4px;
        color: var(--dim);
        font-size: 12px;
      }
      .nm-grid .nm-check {
        flex-direction: row;
        align-items: center;
        gap: 6px;
        color: var(--text);
        align-self: end;
        padding-bottom: 6px;
      }
      .nm-wide {
        grid-column: 1 / -1;
      }
      .nm-row {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--text);
        font-size: 13px;
      }
      .nm-row input {
        flex: 1;
        min-width: 0;
      }
      .nm-row select {
        width: auto;
        flex: none;
      }
      .nm-dim {
        color: var(--dim);
        font-size: 12px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      div.nm-dim {
        white-space: normal;
      }
      .nm-radio .nm-row {
        flex-wrap: wrap;
        gap: 14px;
      }
      .nm-radio label {
        flex-direction: row;
        gap: 5px;
        color: var(--text);
        font-size: 13px;
      }
      .nm-alts button {
        padding: 2px 6px;
        margin-right: 4px;
      }
      .nm-status {
        margin-top: 12px;
        min-height: 18px;
        color: #ffd27a;
      }
      .gls-dialog {
        width: min(1280px, 96vw);
        height: min(820px, 92vh);
        background: #17181e;
        border: 1px solid #383b47;
        border-radius: 10px;
        box-shadow: 0 16px 60px rgba(0, 0, 0, 0.65);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .gls-head {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 14px;
        border-bottom: 1px solid var(--line);
        background: #1b1d25;
      }
      .gls-title {
        font-weight: 700;
        color: #fff;
      }
      .gls-name {
        width: 200px;
      }
      .gls-head input,
      .gls-col input[type='number'],
      .gls-col input[type='text'],
      .gls-col select {
        background: #121318;
        color: var(--text);
        border: 1px solid var(--line);
        border-radius: 5px;
        padding: 4px 6px;
        font: inherit;
      }
      .gls-head .gls-field {
        flex-direction: row;
        align-items: center;
        gap: 6px;
      }
      .gls-head .gls-field input {
        width: 70px;
      }
      .gls-dim {
        color: var(--dim);
        font-size: 12px;
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .gls-body {
        flex: 1;
        min-height: 0;
        display: grid;
        grid-template-columns: 250px 290px minmax(0, 1fr);
      }
      .gls-col {
        overflow-y: auto;
        padding: 10px 12px;
        border-right: 1px solid var(--line);
        min-width: 0;
      }
      .gls-heading {
        color: #fff;
        font-weight: 600;
        font-size: 12px;
        margin: 10px 0 6px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .gls-heading:first-child {
        margin-top: 0;
      }
      .gls-note {
        color: var(--dim);
        font-size: 11px;
        line-height: 1.4;
        margin-bottom: 8px;
      }
      .gls-box {
        border: 1px solid #2a2c35;
        border-radius: 6px;
        padding: 6px 8px;
        margin-bottom: 6px;
        cursor: pointer;
        background: #15161c;
      }
      .gls-box.active {
        border-color: var(--accent);
        background: #1b2333;
      }
      .gls-box .gls-dim {
        display: block;
        white-space: normal;
      }
      .gls-box-name {
        font-weight: 600;
      }
      .gls-box-tools {
        display: flex;
        gap: 4px;
        margin-top: 5px;
      }
      .gls-box-tools button {
        padding: 1px 7px;
      }
      .gls-add {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin: 8px 0;
      }
      .gls-wide {
        width: 100%;
        font-size: 12px;
      }
      .gls-field {
        display: flex;
        flex-direction: column;
        gap: 3px;
        margin-bottom: 8px;
        color: var(--dim);
        font-size: 12px;
      }
      .gls-toggle {
        margin-bottom: 8px;
      }
      .gls-lane {
        width: 100%;
        height: 150px;
        display: block;
        border-radius: 6px;
        border: 1px solid #2a2c35;
        cursor: crosshair;
      }
      .gls-event {
        margin-top: 10px;
        padding: 10px;
        border: 1px solid #2a2c35;
        border-radius: 6px;
        background: #15161c;
      }
      .gls-swatches {
        display: flex;
        gap: 6px;
        align-items: center;
        margin-bottom: 8px;
        flex-wrap: wrap;
      }
      .gls-swatches input[type='color'] {
        width: 34px;
        height: 24px;
        padding: 0;
        border: 1px solid var(--line);
        background: none;
      }
      .gls-swatches input.active {
        outline: 2px solid #fff;
      }
      .th-draggable {
        cursor: grab;
      }
      .pp-wrap {
        position: relative;
      }
      .pp-canvas {
        width: 100%;
        height: 104px;
        display: block;
        border-radius: 8px;
        border: 1px solid #2a2c35;
      }
      .pp-play {
        position: absolute;
        right: 8px;
        bottom: 8px;
        width: 34px;
        height: 34px;
        border-radius: 50%;
        padding: 0;
        font-size: 14px;
        background: rgba(20, 22, 30, 0.85);
      }
      .lib-poses {
        width: 100%;
        margin: 0 0 8px;
      }
      .gls-dock {
        position: fixed;
        z-index: 40;
        display: flex;
      }
      .gls-dock > .gls-dialog {
        width: 100%;
        height: 100%;
        border-radius: 8px;
      }
      .gls-dock .gls-result {
        height: 150px;
      }
      .gls-dock .gls-lane {
        height: 110px;
      }
      .ring-dock {
        position: fixed;
        z-index: 40;
        width: auto;
        height: auto;
        border-radius: 8px;
      }
      .ring-body {
        grid-template-columns: 250px 300px minmax(0, 1fr);
      }
      .ring-lane {
        height: 96px;
      }
      .adjust-shade {
        background: rgba(0, 0, 0, 0.12);
        place-items: center end;
        padding-right: 24px;
      }
      .adjust-dialog {
        width: min(420px, 94vw);
        display: flex;
        flex-direction: column;
        gap: 8px;
        font-size: 13px;
      }
      .adjust-dialog > label:not(.adjust-check) {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .adjust-grid {
        display: grid;
        grid-template-columns: 1.3fr 1fr 1fr;
        gap: 4px 8px;
        align-items: center;
      }
      .adjust-head {
        color: var(--dim);
        font-size: 12px;
      }
      .adjust-check {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .adjust-more {
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding-left: 22px;
      }
      .adjust-more[hidden] {
        display: none;
      }
      .adjust-pair {
        display: flex;
        flex-direction: row;
        align-items: end;
        gap: 8px;
      }
      .adjust-pair label,
      .adjust-more > label:not(.adjust-check) {
        display: flex;
        flex-direction: column;
        gap: 3px;
        color: var(--dim);
        font-size: 12px;
        flex: 1;
      }
      .colors-dialog {
        width: min(460px, 94vw);
      }
      .colors-body.colors-off {
        opacity: 0.55;
      }
      .colors-row {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 6px;
      }
      .colors-row[hidden] {
        display: none;
      }
      .colors-field {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 3px;
        border: 1px solid transparent;
        border-radius: 5px;
      }
      .colors-field.focused {
        border-color: #4a7bd0;
      }
      .colors-field input[type='color'] {
        width: 34px;
        height: 24px;
        padding: 0;
        border: 1px solid var(--line);
        background: none;
      }
      .colors-cover {
        display: flex;
        gap: 10px;
        align-items: center;
      }
      .colors-cover img {
        width: 72px;
        height: 72px;
        object-fit: cover;
        border-radius: 5px;
        background: #121318;
      }
      .colors-palette {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
      }
      .colors-chip {
        width: 26px;
        height: 26px;
        padding: 0;
        border: 1px solid rgba(255, 255, 255, 0.25);
        border-radius: 50%;
      }
      .steps-dialog {
        width: min(440px, 94vw);
      }
      .steps-line {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      .steps-buttons {
        display: flex;
        gap: 4px;
      }
      .steps-picture {
        width: 100%;
        height: auto;
        display: block;
      }
      .sound-bands {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
      }
      .sound-bands button.active {
        border-color: var(--accent, #4a7bd0);
        color: #fff;
        background: #2a3550;
      }
      .adjust-dialog > label input[type='range'] {
        flex: 1;
      }
      .adjust-pair[hidden],
      .adjust-dialog > label[hidden] {
        display: none;
      }
      .adjust-gap {
        flex: 1;
      }
      .adjust-rows {
        max-height: 220px;
        overflow: auto;
        border: 1px solid var(--line);
        border-radius: 5px;
        padding: 4px 6px;
      }
      .ring-game {
        margin-top: 12px;
        padding-top: 8px;
        border-top: 1px solid #2a2d38;
      }
      .ring-list {
        margin-top: 8px;
      }
      .ring-views {
        display: grid;
        grid-template-columns: minmax(160px, 1fr) minmax(0, 2fr);
        gap: 10px;
        height: 230px;
        margin-bottom: 8px;
      }
      .ring-views canvas {
        width: 100%;
        height: 230px;
        display: block;
        border-radius: 6px;
        border: 1px solid #2a2c35;
      }
      .ring-side {
        width: 100%;
        height: 230px;
        display: block;
        border-radius: 6px;
        border: 1px solid #2a2c35;
        margin-bottom: 8px;
      }
      .ring-bars {
        cursor: ns-resize;
      }
      .gls-result {
        border-top: 1px solid var(--line);
        padding: 8px 14px 12px;
        height: 210px;
        display: flex;
        flex-direction: column;
      }
      .gls-result-canvas {
        flex: 1;
        width: 100%;
        min-height: 0;
        display: block;
        border-radius: 6px;
      }
      .ce-menu {
        max-height: calc(100vh - 16px);
        overflow-y: auto;
      }
      button.primary {
        background: #2a4f8f;
        border-color: #3d6bc0;
        color: #fff;
      }
      #drop-hint {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        color: var(--dim);
        pointer-events: none;
        font-size: 15px;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <header id="toolbar">
        <button id="new-map" title="Новая карта из песни (Ctrl+N)">Новая карта</button>
        <button id="open" title="Открыть папку карты (Ctrl+O)">Открыть карту</button>
        <select id="recent" title="Недавние карты" hidden></select>
        <select id="difficulty" title="Сложность" disabled></select>
        <button id="save" title="Сохранить (Ctrl+S)" disabled>Сохранить</button>
        <button id="settings" title="Свойства карты: названия, BPM, начало песни" disabled>Свойства</button>
        <button id="environment" title="Окружение карты: готовые окружения, лишние детали, размер колец и их света" disabled>Окружение</button>
        <button id="map-colors" title="Цвета карты: левый, правый, белый и буст для всей карты (Info.dat), можно взять из обложки" disabled>Цвета</button>
        <span class="sep"></span>
        <button id="undo" title="Отменить (Ctrl+Z)">↶</button>
        <button id="redo" title="Вернуть (Ctrl+Y)">↷</button>
        <span class="sep"></span>
        <button id="play" title="Играть / пауза (Пробел)">▶</button>
        <span id="time">0:00.000 · доля 0.000</span>
        <span class="sep"></span>
        <label>Сетка <select id="snap">
          <option value="1">1</option>
          <option value="0.5">1/2</option>
          <option value="0.25" selected>1/4</option>
          <option value="0.125">1/8</option>
          <option value="0.0625">1/16</option>
          <option value="0">без сетки</option>
        </select></label>
        <label title="Скорость воспроизведения (высота звука меняется вместе с ней)">Скорость <select id="speed">
          <option value="0.25">0.25×</option>
          <option value="0.5">0.5×</option>
          <option value="0.75">0.75×</option>
          <option value="1" selected>1×</option>
          <option value="1.25">1.25×</option>
          <option value="1.5">1.5×</option>
          <option value="2">2×</option>
        </select></label>
        <button id="bookmark" title="Метка у курсора (B). Метки — флажки на линейке: клик — перейти, тянуть — сдвинуть, двойной клик — переименовать, ПКМ — меню. Ctrl+←/→ — к предыдущей/следующей">⚑ Метка</button>
        <span class="sep"></span>
        <button id="zoom-out" title="Отдалить (Ctrl+колесо)">−</button>
        <button id="zoom-fit" title="Вся песня">⇔</button>
        <button id="zoom-in" title="Приблизить (Ctrl+колесо)">+</button>
        <span class="grow"></span>
        <span id="status"></span>
      </header>
      <section id="main">
        <div id="preview-wrap"><canvas id="preview"></canvas></div>
        <aside id="side">
          <div id="library"></div>
        </aside>
      </section>
      <div id="splitter"></div>
      <section id="timeline">
        <div id="track-headers"></div>
        <div id="tracks-wrap"><canvas id="tracks"></canvas></div>
        <aside id="inspector"></aside>
      </section>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
