<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="dark" />
    <title>Lumatic</title>
    <link rel="icon" href="data:," />
    <style>
      :root {
        --bg: #101114;
        --panel: #16171c;
        --panel2: #1c1e25;
        --line: #2a2c34;
        --text: #d9dce4;
        --dim: #8a90a0;
        --accent: #6aa6ff;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font: 13px system-ui, 'Segoe UI', sans-serif;
        overflow: clip;
        user-select: none;
      }
      #app {
        display: grid;
        grid-template-rows: auto minmax(160px, 44%) 6px 1fr;
        height: 100%;
      }
      #toolbar {
        display: flex;
        align-items: center;
        gap: 6px;
        background: var(--panel);
        border-bottom: 1px solid var(--line);
        white-space: nowrap;
        overflow: hidden;
        /* (a narrow window: the toolbar goes on into a second line rather than out of sight) */
        flex-wrap: wrap;
        row-gap: 4px;
        padding: 4px 8px;
        min-height: 40px;
      }
      #toolbar #recent {
        max-width: 140px;
      }
      #toolbar #difficulty {
        max-width: 200px;
      }
      #toolbar label {
        display: flex;
        align-items: center;
        gap: 4px;
      }
      #toolbar .sep {
        width: 1px;
        height: 22px;
        background: var(--line);
        margin: 0 4px;
      }
      #toolbar .grow {
        flex: 1;
      }
      button,
      select,
      input[type='number'] {
        background: var(--panel2);
        color: var(--text);
        border: 1px solid var(--line);
        border-radius: 5px;
        padding: 4px 9px;
        font: inherit;
        cursor: pointer;
      }
      button:hover {
        border-color: #3d4150;
      }
      button:disabled {
        opacity: 0.4;
        cursor: default;
      }
      button.active {
        background: #263a5c;
        border-color: var(--accent);
      }
      /* (what the editor says: over the 3D view's bottom left, not in the toolbar's way) */
      #status {
        position: absolute;
        left: 8px;
        bottom: 6px;
        max-width: calc(100% - 16px);
        padding: 2px 8px;
        border-radius: 4px;
        background: rgba(10, 11, 15, 0.6);
        color: var(--dim);
        font-size: 12px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        pointer-events: none;
      }
      #status:empty {
        display: none;
      }
      #time {
        font-variant-numeric: tabular-nums;
        min-width: 150px;
        color: #fff;
      }
      #sel-infos {
        position: absolute;
        top: 8px;
        left: 8px;
        display: flex;
        gap: 6px;
        pointer-events: none;
      }
      .sel-info {
        backdrop-filter: blur(4px);
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 3px 9px;
        border-radius: 12px;
        background: rgba(40, 70, 130, 0.55);
        border: 1px solid rgba(106, 166, 255, 0.55);
        color: #dfe8ff;
        font-size: 12px;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .sel-info[hidden] {
        display: none;
      }
      .clip-info {
        background: rgba(40, 110, 75, 0.55);
        border-color: rgba(120, 220, 160, 0.55);
        color: #dcf5e6;
      }
      /* ----- the two sides: lights / notes */
      .side-tabs {
        display: inline-flex;
        border: 1px solid var(--line);
        border-radius: 7px;
        overflow: hidden;
      }
      .side-tabs button {
        border: 0;
        border-radius: 0;
        padding: 4px 12px;
      }
      .side-tabs button.active {
        background: #263a5c;
        color: #fff;
      }
      body.notes-tab #library,
      body.notes-tab #inspector,
      body:not(.notes-tab) #note-panel,
      body:not(.notes-tab) #note-inspector {
        display: none !important;
      }
      #view-tools {
        position: absolute;
        top: 8px;
        right: 8px;
        display: flex;
        gap: 4px;
        z-index: 2;
      }
      #view-tools button {
        background: rgba(16, 17, 22, 0.7);
        backdrop-filter: blur(4px);
        min-width: 32px;
        padding: 3px 8px;
      }
      #view-tools button.active {
        background: rgba(38, 58, 92, 0.85);
      }
      #view-tools button:not(.active):not(#view-reset) {
        opacity: 0.6;
      }
      .track-box {
        position: absolute;
        border: 1px solid rgba(140, 180, 255, 0.9);
        background: rgba(120, 170, 255, 0.14);
        pointer-events: none;
        z-index: 1;
      }
      .track-box[hidden] {
        display: none;
      }
      #fly-hint {
        position: absolute;
        right: 8px;
        top: 40px;
        font-size: 11px;
        color: rgba(220, 225, 235, 0.55);
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.2s;
      }
      #preview-wrap:hover #fly-hint {
        opacity: 1;
      }
      #note-panel {
        display: flex;
        flex-direction: column;
        min-height: 0;
        padding: 8px;
        gap: 6px;
      }
      .jump-editor {
        display: grid;
        gap: 6px;
      }
      .jump-fields {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
      }
      .jump-fields label {
        display: grid;
        gap: 3px;
        font-size: 12px;
        color: var(--dim);
      }
      .jump-editor .jump-keep {
        display: flex !important;
        flex-direction: row !important;
        align-items: center;
        justify-content: flex-start;
        gap: 6px;
        font-size: 12px;
        color: var(--dim);
      }
      .jump-editor .jump-keep input {
        width: auto;
        margin: 0;
      }
      .jump-warnings {
        display: grid;
        gap: 3px;
        font-size: 12px;
      }
      .jump-ok {
        color: #7fd99a;
        font-size: 12px;
      }
      .jump-warn {
        color: #f1c46b;
        font-size: 12px;
        line-height: 1.35;
      }
      .jump-bad {
        color: #ff7a7a;
        font-size: 12px;
        line-height: 1.35;
      }
      .nm-newdiff {
        display: grid;
        gap: 6px;
        justify-items: start;
      }
      .np-tools4 {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 6px;
        margin-bottom: 6px;
      }
      .np-tool {
        position: relative;
        aspect-ratio: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1px;
        padding: 3px;
        border: 2px solid var(--line);
        border-radius: 8px;
        background: var(--panel2);
        min-width: 0;
      }
      .np-tool .np-icon-red,
      .np-tool .np-icon-blue {
        width: 100%;
      }
      .np-tool .np-icon {
        width: 74%;
        height: auto;
        pointer-events: none;
      }
      .np-tool span {
        font-size: 10.5px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 100%;
      }
      .np-tool kbd {
        position: absolute;
        top: 2px;
        right: 4px;
        font: 9.5px system-ui, sans-serif;
        color: var(--dim);
      }
      .np-tool.active {
        border-color: #fff;
        background: #263a5c;
        box-shadow: 0 0 10px rgba(140, 180, 255, 0.4);
      }
      .np-hands {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px;
        margin-bottom: 5px;
      }
      .np-hand {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1px;
        padding: 6px 4px;
        border: 2px solid transparent;
        border-radius: 7px;
        opacity: 0.55;
      }
      .np-hand b {
        font-size: 14px;
      }
      .np-hand small {
        font-size: 10.5px;
        opacity: 0.85;
      }
      .np-hand.active {
        opacity: 1;
        border-color: #fff;
        box-shadow: 0 0 10px rgba(255, 255, 255, 0.35);
      }
      .np-scale {
        display: grid;
        grid-template-columns: auto 1fr auto;
        gap: 6px;
        align-items: center;
        font-size: 11px;
        color: var(--dim);
      }
      .np-kinds {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 3px;
      }
      .np-kind {
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 3px 4px;
        font-size: 11px;
        min-width: 0;
      }
      .np-kind span {
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .np-kind i {
        width: 12px;
        height: 12px;
        border-radius: 3px;
        display: inline-block;
      }
      .np-kind kbd {
        margin-left: auto;
        font: 10px system-ui, sans-serif;
        color: var(--dim);
      }
      .np-row {
        display: flex;
        gap: 8px;
        margin-top: 5px;
        align-items: flex-start;
      }
      .np-pad {
        display: grid;
        grid-template-columns: repeat(3, 24px);
        gap: 2px;
      }
      .np-pad button {
        padding: 0;
        height: 21px;
        font-size: 12px;
      }
      .np-side {
        display: flex;
        flex-direction: column;
        gap: 4px;
        font-size: 11px;
        min-width: 0;
      }
      .np-label {
        font-size: 11px;
      }
      .np-grid {
        flex: 1;
        min-height: 90px;
        width: 100%;
        border-radius: 6px;
        cursor: crosshair;
      }
      .np-hint {
        font-size: 10.5px;
        line-height: 1.35;
      }
      #note-inspector {
        overflow-y: auto;
        padding: 8px 12px 16px;
        width: 290px;
        flex-shrink: 0;
        border-left: 1px solid var(--line);
        background: var(--panel);
      }
      #note-inspector h3 {
        margin: 2px 0 8px;
        font-size: 13px;
        color: #fff;
      }
      .ni-stats {
        display: grid;
        gap: 3px;
        margin-bottom: 12px;
        font-size: 12px;
      }
      .ni-stats div {
        display: flex;
        justify-content: space-between;
        gap: 8px;
      }
      .ni-stats span {
        color: var(--dim);
      }
      .ni-checks h3 {
        display: flex;
        align-items: baseline;
        gap: 6px;
      }
      .ni-check-sum {
        font-size: 11px;
        font-weight: 500;
        color: #f1c46b;
      }
      .ni-check-sum.bad {
        color: #ff7a7a;
      }
      .ni-check-sum.ok {
        color: #6fdc8c;
      }
      .ni-tabs {
        display: flex;
        gap: 2px;
        padding: 6px 6px 0;
        margin: -8px -12px 10px;
        border-bottom: 1px solid var(--line);
        position: sticky;
        top: -8px;
        z-index: 2;
        background: var(--panel);
      }
      .ni-tabs button {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        border-radius: 5px 5px 0 0;
        border-bottom: 0;
        padding: 4px 7px;
        font-size: 12.5px;
        background: none;
        color: var(--dim);
        white-space: nowrap;
        min-width: 0;
      }
      .ni-tabs button.active {
        background: var(--panel2);
        color: #fff;
        border-color: var(--line);
      }
      .ni-badge {
        display: inline-flex;
        gap: 3px;
      }
      .ni-badge {
        gap: 2px;
      }
      .ni-badge b {
        font-size: 9.5px;
        min-width: 13px;
        padding: 0 3px;
        border-radius: 7px;
        line-height: 13px;
        color: #111;
        text-align: center;
      }
      .ni-badge b.bad {
        background: #ff6b6b;
      }
      .ni-badge b.warn {
        background: #f1c46b;
      }
      .ni-badge b.ok {
        background: #6fdc8c;
      }
      .ni-badge b.n {
        background: #4a5068;
        color: #fff;
      }
      .ni-ignored {
        margin-top: 10px;
        border-top: 1px solid var(--line);
        padding-top: 6px;
        opacity: 0.75;
      }
      .ni-ignored summary {
        cursor: pointer;
        font-size: 12px;
        color: var(--dim);
        margin-bottom: 4px;
      }
      .ni-strobe-pick {
        margin-top: 8px;
      }
      .ni-strobe {
        margin-top: 12px;
        display: grid;
        gap: 6px;
      }
      .ni-strobe > button {
        justify-self: start;
      }
      .np-strobe {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 4px 5px;
        font-size: 12px;
        margin-top: 4px;
      }
      .np-strobe label {
        display: flex;
        align-items: center;
        gap: 3px;
        white-space: nowrap;
      }
      .np-strobe input[type='number'] {
        width: 44px;
      }
      .np-strobe select {
        width: 58px;
      }
      .ni-check-list {
        display: grid;
        gap: 2px;
      }
      .ni-check {
        display: grid;
        grid-template-columns: 16px 42px 1fr;
        gap: 4px;
        align-items: start;
        text-align: left;
        font-size: 11.5px;
        line-height: 1.3;
        padding: 3px 4px;
        background: transparent;
        border: 1px solid transparent;
        border-radius: 4px;
        color: var(--text, #ddd);
      }
      .ni-check:hover {
        background: rgba(255, 255, 255, 0.06);
        border-color: rgba(255, 255, 255, 0.08);
      }
      .ni-check b {
        font-variant-numeric: tabular-nums;
        color: var(--dim);
        font-weight: 500;
      }
      .ni-check-error span:last-child {
        color: #ffb0b0;
      }
      .ni-check-warn span:last-child {
        color: #f3d79a;
      }
      .ni-check-more {
        margin-top: 4px;
        justify-self: start;
      }
      .set-checks-group {
        margin: 10px 0 2px;
        font-size: 12px;
        font-weight: 600;
        color: var(--dim);
      }
      .set-check-rule {
        display: grid;
        grid-template-columns: auto 1fr auto;
        gap: 2px 8px;
        align-items: baseline;
        font-size: 12.5px;
        padding: 2px 0;
      }
      .set-check-rule small {
        grid-column: 2 / 4;
        color: var(--dim);
        font-size: 11px;
      }
      .set-check-rule em {
        font-style: normal;
        font-size: 10.5px;
        color: #8fb4ff;
      }
      .ni-buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        margin-bottom: 8px;
      }
      .ni-form {
        display: grid;
        gap: 5px;
      }
      .ni-form label {
        display: grid;
        grid-template-columns: 110px 1fr;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        color: var(--dim);
      }
      .ni-form input,
      .ni-form select {
        min-width: 0;
      }
      .th-lanes {
        display: flex;
        flex-direction: column;
      }
      .th-lane {
        flex: 1;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 10px;
        border-bottom: 1px solid var(--line);
        color: var(--dim);
        font-size: 11px;
        min-height: 0;
      }
      .th-lane b {
        color: #fff;
        font-size: 13px;
      }
      #main {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 300px;
        min-height: 0;
        min-width: 0;
      }
      #preview-wrap {
        position: relative;
        min-height: 0;
        background: #000;
      }
      #preview-wrap canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      #side {
        min-width: 0;
        overflow: hidden;
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        grid-template-rows: minmax(0, 1fr);
        border-left: 1px solid var(--line);
        background: var(--panel);
        min-height: 0;
      }
      #library {
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
      .lib-tabs {
        display: flex;
        gap: 2px;
        padding: 4px 6px 0;
        border-bottom: 1px solid var(--line);
        flex-shrink: 0;
      }
      .lib-tabs button {
        border-radius: 5px 5px 0 0;
        border-bottom: 0;
        padding: 4px 10px;
        background: none;
        color: var(--dim);
      }
      .lib-tabs button.active {
        background: var(--panel2);
        color: #fff;
        border-color: var(--line);
      }
      .lib-body {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
      }
      .lib-presets {
        display: flex;
        flex-direction: column;
        min-height: 0;
        flex: 1;
      }
      .lib-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 6px;
        padding: 6px 8px 2px;
      }
      .lib-head button {
        padding: 2px 8px;
        font-size: 12px;
      }
      .lib-select {
        padding: 2px 4px;
        font-size: 12px;
        max-width: 140px;
      }
      .lib-target {
        color: var(--dim);
        font-size: 11px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .lib-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px;
        padding: 6px 8px;
      }
      .lib-card {
        position: relative;
        background: #16171d;
        border: 1px solid #2a2c35;
        border-radius: 6px;
        padding: 4px;
        cursor: pointer;
        min-width: 0;
      }
      .lib-card:hover {
        border-color: #4a5068;
      }
      .lib-card.armed {
        border-color: var(--accent);
        box-shadow: 0 0 0 1px var(--accent) inset;
      }
      .lib-card canvas {
        width: 100%;
        height: auto;
        aspect-ratio: 200 / 64;
        display: block;
        border-radius: 3px;
      }
      .lib-name {
        font-size: 11px;
        margin-top: 3px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        padding-right: 18px;
      }
      .lib-try {
        position: absolute;
        right: 3px;
        bottom: 2px;
        padding: 0 4px;
        font-size: 10px;
        line-height: 15px;
        opacity: 0;
      }
      .lib-card:hover .lib-try {
        opacity: 1;
      }
      .lib-tip {
        color: var(--dim);
        font-size: 11px;
        padding: 4px 10px 10px;
        line-height: 1.4;
      }
      .pr-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 6px 10px;
        color: #fff;
        font-weight: 600;
        border-bottom: 1px solid var(--line);
      }
      .pr-head button {
        padding: 2px 8px;
        font-weight: 400;
      }
      .pr-list {
        overflow-y: auto;
        flex: 1;
        min-height: 0;
      }
      .pr-empty {
        color: var(--dim);
        font-size: 12px;
        padding: 10px;
        line-height: 1.45;
      }
      .pr-item {
        min-width: 0;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 5px 10px;
        border-bottom: 1px solid #22242b;
      }
      .pr-item:hover {
        background: #1d1f27;
      }
      .pr-sketch {
        width: 96px;
        height: 30px;
        border-radius: 3px;
        flex-shrink: 0;
      }
      .pr-text {
        flex: 1;
        min-width: 0;
      }
      .pr-name {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .pr-info {
        color: var(--dim);
        font-size: 11px;
      }
      .pr-item button {
        padding: 2px 7px;
      }
      #inspector {
        overflow-y: auto;
        padding: 8px 12px 16px;
        width: 290px;
        flex-shrink: 0;
        border-left: 1px solid var(--line);
        background: var(--panel);
      }
      #inspector h3 {
        margin: 2px 0 10px;
        font-size: 13px;
        color: #fff;
      }
      .ins-section {
        margin-bottom: 10px;
      }
      .ins-label {
        color: var(--dim);
        font-size: 11px;
        margin-bottom: 4px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .ins-buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
      }
      .ins-buttons button {
        padding: 3px 7px;
      }
      .ins-color {
        display: flex;
        gap: 6px;
        align-items: center;
      }
      .ins-swatch {
        width: 26px;
        height: 22px;
        padding: 0;
        border-radius: 4px;
      }
      .ins-swatch.active,
      .ins-color input.active {
        outline: 2px solid #fff;
        outline-offset: 1px;
      }
      .ins-color input[type='color'] {
        width: 34px;
        height: 24px;
        padding: 0;
        border: 1px solid var(--line);
        background: none;
      }
      .ins-bright {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-top: 6px;
      }
      .ins-bright input {
        flex: 1;
      }
      .ins-value {
        width: 34px;
        color: var(--dim);
      }
      .ins-number {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        margin: 6px 0;
        color: var(--dim);
      }
      .ins-number input {

        gap: 8px;

      .gls-dialog {

        flex-direction: row;
        align-items: center;
        gap: 6px;
      }

        width: 70px;
      }
      .gls-dim {
        color: var(--dim);

        white-space: nowrap;
      }
      .gls-body {

      .gls-col {

        text-transform: uppercase;

      }
      .ins-hue-row {
        display: grid;
        grid-template-columns: 1fr;
        gap: 3px;
        margin: 6px 0;
        font-size: 12px;
        color: var(--dim);
      }
      .ins-hue-row {
        grid-template-columns: minmax(0, 1fr) 64px;
      }
      .ins-hue-row > span {
        grid-column: 1 / -1;
      }
      .ins-hue-row input[type='range'] {
        -webkit-appearance: none;
        appearance: none;
        height: 10px;
        border-radius: 5px;

      .drum {

        min-width: 150px;
        height: 34px;
        border-radius: 8px;
        background: linear-gradient(180deg, #0c0d11 0%, #1f2129 45%, #1f2129 55%, #0c0d11 100%);
        border: 1px solid var(--line);
        overflow: hidden;
        cursor: ew-resize;
        user-select: none;
        touch-action: none;
        outline: none;

        top: 3px;

        text-align: center;
        font-size: 14px;
        font-weight: 600;
        background: #0c0d11;
        color: #fff;
        border: 1px solid var(--accent);
        border-radius: 6px;
        padding: 0 6px;

        align-items: center;
        gap: 8px;

        border-left: 3px solid #ffb83d;

      }
      .mode-icon {
        display: block;
        width: 30px;
        height: 16px;
      }
      .ins-buttons button.icon-button {
        padding: 3px 7px;
      }
      .drum-rim {
        position: absolute;
        inset: 0;
      }
      .drum-item {
        position: absolute;
        left: 0;
        top: 50%;

        position: absolute;
        left: 50%;
        top: 3px;
        bottom: 3px;
        width: 54px;
        transform: translateX(-50%);
        border-radius: 6px;
        border: 1px solid rgba(106, 166, 255, 0.55);
        background: rgba(106, 166, 255, 0.08);
        pointer-events: none;
      }
      .gls-zoom {
        float: right;
        display: inline-flex;
        gap: 2px;
        text-transform: none;
        letter-spacing: 0;
      }
      .gls-zoom button {
        padding: 0 7px;
        line-height: 18px;
        font-size: 12px;
      }
      .gls-heading:first-child {
        margin-top: 0;
      }
      .gls-note {
        color: var(--dim);
        font-size: 11px;
        line-height: 1.4;
        margin-bottom: 8px;
      }
      .gls-box {
        border: 1px solid #2a2c35;
        border-radius: 6px;
        padding: 6px 8px;
        margin-bottom: 6px;
        cursor: pointer;
        background: #15161c;

      .gls-box.active {

        background: #1b2333;
      }
      .gls-box .gls-dim {

      }
      .gls-box-name {
        font-weight: 600;
      }

        gap: 4px;
        margin-top: 5px;
      }
      .gls-box-tools button {
        padding: 1px 7px;
      }

        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin: 8px 0;
      }
      .gls-wide {
        width: 100%;
        font-size: 12px;
      }
      .gls-field {
        display: flex;
        flex-direction: column;
        gap: 3px;
        margin-bottom: 8px;
        color: var(--dim);
        font-size: 12px;
      }
      .gls-toggle {
        margin-bottom: 8px;
      }
      .gls-lane {
        width: 100%;
        height: 150px;

      }

        margin-top: 10px;
        padding: 10px;
        border: 1px solid #2a2c35;
        border-radius: 6px;
        background: #15161c;
      }
      .gls-swatches {
        display: flex;
        gap: 6px;
        align-items: center;
        margin-bottom: 8px;
        flex-wrap: wrap;
      }
      .gls-swatches input[type='color'] {
        width: 34px;
        height: 24px;
        padding: 0;
        border: 1px solid var(--line);
        background: none;
      }
      .gls-swatches input.active {
        outline: 2px solid #fff;
      }
      .th-draggable {
        cursor: grab;
      }
      .pp-wrap {
        position: relative;
      }
      .pp-canvas {
        width: 100%;
        height: 104px;
        display: block;
        border-radius: 8px;
        border: 1px solid #2a2c35;
      }
      .pp-play {
        position: absolute;
        right: 8px;
        bottom: 8px;
        width: 34px;
        height: 34px;
        border-radius: 50%;
        padding: 0;
        font-size: 14px;
        background: rgba(20, 22, 30, 0.85);
      }
      .lib-poses {
        width: 100%;
        margin: 0 0 8px;
      }
      .gls-dock {
        position: fixed;
        z-index: 40;
        display: flex;
      }
      .gls-dock > .gls-dialog {
        width: 100%;
        height: 100%;
        border-radius: 8px;
      }
      .gls-dock .gls-result {
        height: 150px;
      }
      .gls-dock .gls-lane {
        height: 110px;
      }
      .ring-dock {
        position: fixed;
        z-index: 40;
        width: auto;
        height: auto;
        border-radius: 8px;
      }
      .ring-body {
        grid-template-columns: 250px 300px minmax(0, 1fr);
      }
      .ring-lane {
        height: 96px;
      }
      .adjust-shade {
        background: rgba(0, 0, 0, 0.12);
        place-items: center end;
        padding-right: 24px;
      }
      .adjust-dialog {
        width: min(420px, 94vw);
        display: flex;
        flex-direction: column;
        gap: 8px;
        font-size: 13px;
      }
      .adjust-dialog > label:not(.adjust-check) {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .adjust-grid {
        display: grid;
        grid-template-columns: 1.3fr 1fr 1fr;
        gap: 4px 8px;
        align-items: center;
      }
      .adjust-head {
        color: var(--dim);
        font-size: 12px;
      }
      .adjust-check {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .adjust-more {
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding-left: 22px;
      }
      .adjust-more[hidden] {
        display: none;
      }
      .adjust-pair {
        display: flex;
        flex-direction: row;
        align-items: end;
        gap: 8px;
      }
      .adjust-pair label,
      .adjust-more > label:not(.adjust-check) {
        display: flex;
        flex-direction: column;
        gap: 3px;
        color: var(--dim);
        font-size: 12px;
        flex: 1;
      }
      .colors-dialog {
        width: min(460px, 94vw);
      }
      .colors-body.colors-off {
        opacity: 0.55;
      }
      .colors-row {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 6px;
      }
      .colors-row[hidden] {
        display: none;
      }
      .colors-field {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 3px;
        border: 1px solid transparent;
        border-radius: 5px;
      }
      .colors-field.focused {
        border-color: #4a7bd0;
      }
      .colors-field input[type='color'] {
        width: 34px;
        height: 24px;
        padding: 0;
        border: 1px solid var(--line);
        background: none;
      }
      .colors-cover {
        display: flex;
        gap: 10px;
        align-items: center;
      }
      .colors-cover img {
        width: 72px;
        height: 72px;
        object-fit: cover;
        border-radius: 5px;
        background: #121318;
      }
      .colors-palette {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
      }
      .colors-chip {
        width: 26px;
        height: 26px;
        padding: 0;
        border: 1px solid rgba(255, 255, 255, 0.25);
        border-radius: 50%;
      }
      .laser-part {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .laser-part[hidden] {
        display: none;
      }
      .steps-dialog {
        width: min(440px, 94vw);
      }
      .steps-line {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      .steps-buttons {
        display: flex;
        gap: 4px;
      }
      .steps-picture {
        width: 100%;
        height: auto;
        display: block;
      }
      .sound-bands {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
      }
      .sound-bands button.active {
        border-color: var(--accent, #4a7bd0);
        color: #fff;
        background: #2a3550;
      }
      .adjust-dialog > label input[type='range'] {
        flex: 1;
      }
      .adjust-pair[hidden],
      .adjust-dialog > label[hidden] {
        display: none;
      }
      .adjust-gap {
        flex: 1;
      }
      .adjust-rows {
        max-height: 220px;
        overflow: auto;
        border: 1px solid var(--line);
        border-radius: 5px;
        padding: 4px 6px;
      }
      .ring-game {
        margin-top: 12px;
        padding-top: 8px;
        border-top: 1px solid #2a2d38;
      }
      .ring-list {
        margin-top: 8px;
      }
      .ring-views {
        display: grid;
        grid-template-columns: minmax(160px, 1fr) minmax(0, 2fr);
        gap: 10px;
        height: 230px;
        margin-bottom: 8px;
      }
      .ring-views canvas {
        width: 100%;
        height: 230px;
        display: block;
        border-radius: 6px;
        border: 1px solid #2a2c35;
      }
      .ring-side {
        width: 100%;
        height: 230px;
        display: block;
        border-radius: 6px;
        border: 1px solid #2a2c35;
        margin-bottom: 8px;
      }
      .ring-bars {
        cursor: ns-resize;
      }
      .gls-result {
        border-top: 1px solid var(--line);
        padding: 8px 14px 12px;
        height: 210px;
        display: flex;
        flex-direction: column;
      }
      .gls-result-canvas {
        flex: 1;
        width: 100%;
        min-height: 0;
        display: block;
        border-radius: 6px;
      }
      .ce-menu {
        max-height: calc(100vh - 16px);
        overflow-y: auto;
      }
      button.primary {
        background: #2a4f8f;
        border-color: #3d6bc0;
        color: #fff;
      }
      #drop-hint {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        color: var(--dim);
        pointer-events: none;
        font-size: 15px;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <header id="toolbar">
        <button id="new-map" title="Новая карта из песни (Ctrl+N)">Новая карта</button>
        <button id="open" title="Открыть папку карты (Ctrl+O)">Открыть карту</button>
        <select id="recent" title="Недавние карты" hidden></select>
        <select id="difficulty" title="Сложность" disabled></select>
        <span class="side-tabs"><button id="tab-lights" class="active" title="Свет: события, эффекты, кольца, лазеры (Tab — переключить)">💡 Свет</button><button id="tab-notes" title="Ноты, бомбы, стены, дуги и цепи (Tab — переключить)">◆ Ноты</button></span>
        <button id="save" title="Сохранить (Ctrl+S)" disabled>Сохранить</button>
        <button id="settings" title="Свойства карты: названия, BPM, начало песни" disabled>Свойства</button>
        <button id="environment" title="Окружение карты: готовые окружения, лишние детали, размер колец и их света" disabled>Окружение</button>
        <button id="map-colors" title="Цвета карты: левый, правый, белый и буст для всей карты (Info.dat), можно взять из обложки" disabled>Цвета</button>
        <span class="sep"></span>
        <button id="undo" title="Отменить (Ctrl+Z)">↶</button>
        <button id="redo" title="Вернуть (Ctrl+Y)">↷</button>
        <span class="sep"></span>
        <button id="play" title="Играть / пауза (Пробел)">▶</button>
        <span id="time">0:00.000 · доля 0.000</span>

        <span class="sep"></span>
        <button id="bookmark" title="Метка у курсора (B). Метки — флажки на линейке: клик — перейти, тянуть — сдвинуть, двойной клик — переименовать, ПКМ — меню. Ctrl+←/→ — к предыдущей/следующей">⚑ Метка</button>
        <span class="sep"></span>
        <button id="zoom-out" title="Отдалить (Ctrl+колесо)">−</button>
        <button id="zoom-fit" title="Вся песня">⇔</button>
        <button id="zoom-in" title="Приблизить (Ctrl+колесо)">+</button>
        <button id="app-settings" title="Настройки: язык, вставка, вид, звук, сохранение, горячие клавиши">⚙</button>
        <span class="grow"></span>
      </header>
      <section id="main">
        <div id="preview-wrap"><canvas id="preview"></canvas><div id="view-tools"><button id="view-mode" hidden></button><button id="view-reset" hidden title="Вернуть камеру на место игрока">⟲ Вид</button><button id="view-lights">💡</button><button id="view-notes">◆</button></div><span id="fly-hint">ПКМ + мышь — осмотреться, WASD — лететь, Пробел / Ctrl — вверх / вниз, Shift — быстрее</span><span id="status"></span><div id="sel-infos"><span id="selection-info" class="sel-info" hidden></span><span id="clipboard-info" class="sel-info clip-info" hidden></span></div></div>
        <aside id="side">
          <div id="library"></div>
          <div id="note-panel"></div>
        </aside>
      </section>
      <div id="splitter"></div>
      <section id="timeline">
        <div id="track-headers"></div>
        <div id="tracks-wrap"><canvas id="tracks"></canvas></div>
        <aside id="inspector"></aside>
        <aside id="note-inspector"></aside>
      </section>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
