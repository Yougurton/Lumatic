<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="dark" />
    <title>ChroEditor</title>
    <style>
      :root {
        --bg: #101114;
        --panel: #16171c;
        --panel2: #1c1e25;
        --line: #2a2c34;
        --text: #d9dce4;
        --dim: #8a90a0;
        --accent: #6aa6ff;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font: 13px system-ui, 'Segoe UI', sans-serif;
        overflow: hidden;
        user-select: none;
      }
      #app {
        display: grid;
        grid-template-rows: 40px minmax(160px, 44%) 6px 1fr;
        height: 100%;
      }
      #toolbar {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 0 8px;
        background: var(--panel);
        border-bottom: 1px solid var(--line);
        white-space: nowrap;
        overflow: hidden;
      }
      #toolbar .sep {
        width: 1px;
        height: 22px;
        background: var(--line);
        margin: 0 4px;
      }
      #toolbar .grow {
        flex: 1;
      }
      button,
      select,
      input[type='number'] {
        background: var(--panel2);
        color: var(--text);
        border: 1px solid var(--line);
        border-radius: 5px;
        padding: 4px 9px;
        font: inherit;
        cursor: pointer;
      }
      button:hover {
        border-color: #3d4150;
      }
      button:disabled {
        opacity: 0.4;
        cursor: default;
      }
      button.active {
        background: #263a5c;
        border-color: var(--accent);
      }
      #status {
        color: var(--dim);
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 38vw;
      }
      #time {
        font-variant-numeric: tabular-nums;
        min-width: 150px;
        color: #fff;
      }
      #main {
        display: grid;
        grid-template-columns: 1fr 300px;
        min-height: 0;
      }
      #preview-wrap {
        position: relative;
        min-height: 0;
        background: #000;
      }
      #preview-wrap canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      #side {
        display: grid;
        grid-template-rows: 190px 1fr;
        border-left: 1px solid var(--line);
        background: var(--panel);
        min-height: 0;
      }
      #minimap {
        width: 100%;
        height: 100%;
        display: block;
        border-bottom: 1px solid var(--line);
        cursor: pointer;
      }
      #inspector {
        overflow-y: auto;
        padding: 8px 12px 16px;
      }
      #inspector h3 {
        margin: 2px 0 10px;
        font-size: 13px;
        color: #fff;
      }
      .ins-section {
        margin-bottom: 10px;
      }
      .ins-label {
        color: var(--dim);
        font-size: 11px;
        margin-bottom: 4px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .ins-buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
      }
      .ins-buttons button {
        padding: 3px 7px;
      }
      .ins-color {
        display: flex;
        gap: 6px;
        align-items: center;
      }
      .ins-swatch {
        width: 26px;
        height: 22px;
        padding: 0;
        border-radius: 4px;
      }
      .ins-swatch.active,
      .ins-color input.active {
        outline: 2px solid #fff;
        outline-offset: 1px;
      }
      .ins-color input[type='color'] {
        width: 34px;
        height: 24px;
        padding: 0;
        border: 1px solid var(--line);
        background: none;
      }
      .ins-bright {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-top: 6px;
      }
      .ins-bright input {
        flex: 1;
      }
      .ins-value {
        width: 34px;
        color: var(--dim);
      }
      .ins-number {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        margin: 6px 0;
        color: var(--dim);
      }
      .ins-number input {
        width: 92px;
      }
      .ins-check {
        display: block;
        margin: 6px 0 10px;
        color: var(--text);
      }
      .ins-note {
        color: var(--dim);
        font-size: 12px;
        line-height: 1.45;
        margin-top: 10px;
      }
      #splitter {
        background: var(--line);
        cursor: ns-resize;
      }
      #timeline {
        display: flex;
        min-height: 0;
        position: relative;
        background: var(--panel);
      }
      #track-headers {
        width: 210px;
        flex-shrink: 0;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        border-right: 1px solid var(--line);
        background: var(--panel);
      }
      .th-ruler {
        border-bottom: 1px solid var(--line);
        color: var(--dim);
        padding: 6px 10px;
        font-size: 11px;
        background: #101115;
        position: sticky;
        top: 0;
        z-index: 1;
      }
      .th-rows {
        overflow: hidden;
      }
      .th-spectro {
        border-top: 1px solid var(--line);
        color: var(--dim);
        font-size: 11px;
        padding: 8px 10px;
        background: #0b0b10;
      }
      .th-row {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 0 8px;
        border-bottom: 1px solid #25272f;
        overflow: hidden;
        white-space: nowrap;
      }
      .th-group {
        background: #1b1d24;
        font-weight: 600;
      }
      .th-light {
        padding-left: 36px;
        color: var(--dim);
        font-size: 12px;
        cursor: pointer;
      }
      .th-light:hover,
      .th-light.picked {
        color: #3dff7a;
      }
      .th-raw {
        color: #b9bfcc;
        font-size: 12px;
        background: #191a1f;
      }
      .th-toggle {
        width: 20px;
        height: 20px;
        padding: 0;
        line-height: 1;
      }
      .th-swatch {
        width: 8px;
        height: 14px;
        border-radius: 2px;
        flex-shrink: 0;
      }
      .th-name {
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .th-count {
        color: var(--dim);
        font-weight: 400;
        font-size: 11px;
      }
      #tracks-wrap {
        flex: 1;
        position: relative;
        min-width: 0;
      }
      #tracks {
        display: block;
      }
      #drop-hint {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        color: var(--dim);
        pointer-events: none;
        font-size: 15px;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <header id="toolbar">
        <button id="open" title="Открыть папку карты (Ctrl+O)">Открыть карту</button>
        <select id="recent" title="Недавние карты" hidden></select>
        <select id="difficulty" title="Сложность" disabled></select>
        <button id="save" title="Сохранить (Ctrl+S)" disabled>Сохранить</button>
        <span class="sep"></span>
        <button id="undo" title="Отменить (Ctrl+Z)">↶</button>
        <button id="redo" title="Вернуть (Ctrl+Y)">↷</button>
        <span class="sep"></span>
        <button id="play" title="Играть / пауза (Пробел)">▶</button>
        <span id="time">0:00.000 · доля 0.000</span>
        <span class="sep"></span>
        <label>Сетка <select id="snap">
          <option value="1">1</option>
          <option value="0.5">1/2</option>
          <option value="0.25" selected>1/4</option>
          <option value="0.125">1/8</option>
          <option value="0.0625">1/16</option>
          <option value="0">без сетки</option>
        </select></label>
        <button id="zoom-out" title="Отдалить (Ctrl+колесо)">−</button>
        <button id="zoom-fit" title="Вся песня">⇔</button>
        <button id="zoom-in" title="Приблизить (Ctrl+колесо)">+</button>
        <span class="grow"></span>
        <span id="status"></span>
      </header>
      <section id="main">
        <div id="preview-wrap"><canvas id="preview"></canvas></div>
        <aside id="side">
          <canvas id="minimap"></canvas>
          <div id="inspector"></div>
        </aside>
      </section>
      <div id="splitter"></div>
      <section id="timeline">
        <div id="track-headers"></div>
        <div id="tracks-wrap"><canvas id="tracks"></canvas></div>
      </section>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
