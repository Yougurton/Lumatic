name: Build Windows online installer

on:
  pull_request:
    paths:
      - ".github/workflows/build-windows-installer.yml"
      - "package.json"
      - "package-lock.json"
      - "electron/**"
      - "src/**"
      - "scripts/build-online-distribution.mjs"
      - "scripts/generate-third-party-notices.cjs"
      - "scripts/release-source.cjs"
      - "installer/**"
      - "licenses/**"
      - "LICENSE"
      - "THIRD_PARTY_NOTICES.md"
      - "vite.config.ts"
      - "index.html"
      - "preview.html"
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Build app payload and online installer
        run: npm run dist:win:online

      - name: Check release tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = node -p "require('./package.json').version"
          if ($env:RELEASE_TAG -ne "v$version") {
            throw "Tag $env:RELEASE_TAG does not match package.json version v$version"
          }

      - name: Build corresponding source archive
        if: startsWith(github.ref, 'refs/tags/')
        run: npm run dist:source

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Lumatic-Windows-Online-Installer
          path: |
            release/Lumatic-Setup-*-win-x64.exe
            release/Lumatic-win-x64.zip
            release/Lumatic-win-x64.zip.sha256
            release/Lumatic-*-source.zip
          if-no-files-found: error
          retention-days: 14

      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Lumatic ${{ github.ref_name }}
          files: |
            release/Lumatic-Setup-*-win-x64.exe
            release/Lumatic-win-x64.zip
            release/Lumatic-win-x64.zip.sha256
            release/Lumatic-*-source.zip
